<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Seller Center — Rumah Cetak</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
aside{width:230px;background:var(--n);color:#dfe4f2;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.lg{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:800;color:#fff}.lg i{font:800 20px Georgia,serif;color:var(--g);font-style:normal;border:2px solid var(--g);border-radius:8px;padding:0 6px}
aside button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;display:flex;gap:10px}aside button:hover{background:var(--n2)}aside button.on{background:var(--g);color:var(--n);font-weight:700}
main{flex:1;min-width:0;padding:0 28px 40px}.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 0}

button.b,a.b{all:unset;cursor:pointer;background:var(--n);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;display:inline-block}button.b.g{background:var(--g);color:var(--n)}button.b.l{background:#e8eaf2;color:var(--n)}button.b.r{background:#fbe5e5;color:var(--bad)}button.b.pulse{animation:p 1.4s infinite}@keyframes p{50%{box-shadow:0 0 0 6px #c9a24b55}}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #d5d9e6;border-radius:10px;background:#fff;width:100%;min-width:0}textarea{min-height:70px}label{display:block;font-weight:600;font-size:12px;color:var(--m)}label>*{margin-top:4px;font-weight:400;color:var(--t)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eceef5;vertical-align:middle}th{font-size:12px;color:var(--m)}
.pill{padding:2px 10px;border-radius:99px;background:#f5e8c4;font-size:12px;font-weight:600}.pill.ok{background:#d6f3e1;color:var(--ok)}.thumb{width:48px;height:36px;border-radius:6px;object-fit:cover;background:#e8eaf2}
.chart{display:flex;gap:4px;align-items:flex-end;height:150px;overflow-x:auto;padding-top:8px}.chart div{flex:1 0 22px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--m)}.chart span{display:flex;gap:2px;align-items:flex-end;width:100%;flex:1}.chart i{flex:1;border-radius:3px 3px 0 0;background:var(--g);min-height:1px}.chart i.o{background:var(--n)}
.ord{border:1px solid #eceef5;border-radius:12px;padding:12px;margin-bottom:10px}.ord header{display:flex;gap:8px;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
dialog{border:0;border-radius:var(--r);width:min(560px,94vw);padding:20px}dialog::backdrop{background:#0f1b3d99}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:10px;z-index:9}.mut{color:var(--m)}.w{overflow-x:auto}
@media(max-width:820px){body{flex-direction:column}aside{width:auto;height:auto;flex-direction:row;overflow-x:auto;position:sticky;z-index:6;padding:8px}aside .lg{display:none}aside button{white-space:nowrap}main{padding:0 14px 40px}}
@media print{aside,.bar button,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style></head><body>
<aside><div class="lg"><i>RC</i>Seller Center</div><div id="nav" style="display:contents"></div></aside>
<main><div class="bar"><h1 id="ttl"></h1><div class="row"><button class="b l" id="disc" hidden>Buang perubahan</button><button class="b g" id="pub">Publikasikan ke web</button></div></div><div id="v"></div></main>
<dialog id="dlg"></dialog><div id="toast" hidden></div>
<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),rp=n=>"Rp "+Math.round(n).toLocaleString("id-ID");
const C={};["api","key","repo","tok","br","site"].forEach(k=>C[k]=localStorage.getItem("rc_"+k)||"");C.br=C.br||"main";C.site=C.site||"https://rumahcetak.my.id";
let S=null,ORD=[],FIN=[],dirty=false,view="dash",IMG={};const today=()=>new Date(Date.now()+252e5).toISOString().slice(0,10);
const FR={t:"30",m:today().slice(0,7),y:today().slice(0,4)};
const ST={fisik:["Diterima","Draf","Revisi","Cetak","Dikirim","Selesai"],web:["Diterima","Draf","Revisi","Pembuatan","Link aktif","Selesai"],video:["Diterima","Draf","Revisi","Rendering","Siap diunduh","Selesai"]};ST.umkm=ST.fisik;
const NAV=[["dash","▦ Dashboard"],["ord","☰ Pesanan"],["prod","▣ Produk"],["gal","▤ Galeri"],["fin","$ Keuangan"],["tamp","✎ Tampilan Web"],["set","⚙ Pengaturan"]];
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)};
async function adm(a,p={}){if(!C.api)throw Error("URL Apps Script belum diisi (menu Pengaturan)");const r=await fetch(C.api,{method:"POST",body:JSON.stringify({a:"adm_"+a,key:C.key,...p})}),j=await r.json();if(j.error)throw Error(j.error);return j}
const gh=(p,m="GET",b)=>fetch(`https://api.github.com/repos/${C.repo}/contents/${p}`+(m=="GET"?"?ref="+C.br:""),{method:m,headers:{Authorization:"Bearer "+C.tok,Accept:"application/vnd.github+json"},body:b&&JSON.stringify(b)});
async function loadSite(){const W={};for(const f of["data.js","override.js"]){const r=await fetch(C.site+"/assets/"+f+"?t="+Date.now());if(r.ok)new Function("window",await r.text())(W)}
 S=W.SITE;if(!S)throw Error("data.js tidak terbaca dari "+C.site);S.gallery=S.gallery||[];const d=localStorage.getItem("rc_draft");if(d){try{S=JSON.parse(d);dirty=true}catch(_){}}}
const touch=()=>{dirty=true;localStorage.setItem("rc_draft",JSON.stringify(S));bar()};
function bar(){$("#pub").classList.toggle("pulse",dirty);$("#disc").hidden=!dirty}
async function upload(file){if(!C.tok||!C.repo)throw Error("Isi repo & token GitHub di Pengaturan");const b=await createImageBitmap(file),sc=Math.min(1,1400/Math.max(b.width,b.height)),cv=document.createElement("canvas");cv.width=b.width*sc;cv.height=b.height*sc;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(b,0,0,cv.width,cv.height);
 const url=cv.toDataURL("image/jpeg",.82),path="assets/img/"+Date.now().toString(36)+".jpg",r=await gh(path,"PUT",{message:"Upload gambar via Seller Center",content:url.split(",")[1],branch:C.br});if(!r.ok)throw Error("Upload gagal ("+r.status+")");IMG[path]=url;return path}
const src=p=>p?(IMG[p]||(/^https?:/.test(p)?p:C.site+"/"+p)):"";
async function publish(){if(!S)return;const o={};["brand","tagline","wa","heroImg","promo","contact","faq","gallery","products","about"].forEach(k=>o[k]=S[k]);
 const body="/* Dibuat otomatis oleh Seller Center. Jangan diedit manual. */\nObject.assign(window.SITE,"+JSON.stringify(o)+");\n",p="assets/override.js";let sha;const g=await gh(p);if(g.ok)sha=(await g.json()).sha;
 const r=await gh(p,"PUT",{message:"Update konten via Seller Center",content:btoa(unescape(encodeURIComponent(body))),branch:C.br,sha});if(!r.ok)throw Error("Gagal publikasi ("+r.status+"). Cek repo/token.");dirty=false;localStorage.removeItem("rc_draft");bar();toast("Terkirim ✓ Web utama diperbarui dalam ±1 menit")}
$("#pub").onclick=()=>publish().catch(e=>toast(e.message));$("#disc").onclick=()=>{if(confirm("Buang semua perubahan yang belum dipublikasikan?")){localStorage.removeItem("rc_draft");boot()}};
const act=()=>ORD.filter(o=>o.Tahap!=="Selesai"),inR=(f,t)=>FIN.filter(x=>x.tgl>=f&&x.tgl<=t);
function rng(){const td=today(),d=new Date(td),t=FR.t;if(t=="bulan")return[FR.m+"-01",FR.m+"-31"];if(t=="tahun")return[FR.y+"-01-01",FR.y+"-12-31"];if(t=="semua")return["0000","9999"];
 if(t=="180")d.setMonth(d.getMonth()-6);else if(t=="365")d.setFullYear(d.getFullYear()-1);else d.setDate(d.getDate()-(+t-1));if(t=="180"||t=="365")d.setDate(d.getDate()+1);return[d.toISOString().slice(0,10),td]}
function sum(l){const m=l.filter(x=>x.tipe=="masuk").reduce((a,x)=>a+x.jml,0),h=l.filter(x=>x.tipe=="keluar"&&x.kat=="Bahan (HPP)").reduce((a,x)=>a+x.jml,0),k=l.filter(x=>x.tipe=="keluar").reduce((a,x)=>a+x.jml,0);return{m,h,o:k-h,k,gp:m-h,np:m-k}}
const kpi=(a,b)=>`<div class="card"><small>${a}</small><b>${b}</b></div>`;
const V={
dash(){const s=sum(inR(today().slice(0,7)+"-01",today().slice(0,7)+"-31"));return`<div class="kpi">${kpi("Omzet bulan ini",rp(s.m))}${kpi("Laba bersih",rp(s.np))}${kpi("Pesanan aktif",act().length)}${kpi("Produk tayang",S.products.length)}</div>
 <div class="card"><h3>Antrean pesanan aktif</h3><div class="w"><table><tr><th>Kode</th><th>Produk</th><th>Tahap</th><th>Update</th></tr>${act().slice(-8).reverse().map(o=>`<tr><td>${esc(o.Kode)}</td><td>${esc(o.Produk)}</td><td><span class="pill">${esc(o.Tahap)}</span></td><td class="mut">${esc(o.Update)}</td></tr>`).join("")||'<tr><td colspan=4 class="mut">Tidak ada pesanan aktif.</td></tr>'}</table></div></div>
 <div class="card"><h3>Alur kerja</h3><p class="mut">Pesanan &amp; keuangan tersimpan di Google Sheets (langsung aktif). Perubahan produk, promo, galeri, dan teks harus dipublikasikan lewat tombol emas di kanan atas.</p><a class="b l" href="${esc(C.site)}" target="_blank" rel="noopener">Lihat web utama ↗</a></div>`},
ord(){return`<div class="card"><details><summary><b>+ Pesanan baru</b></summary><div class="g2" style="margin-top:12px"><label>Kode<input id="nk" value="RC-${Math.random().toString(36).slice(2,7).toUpperCase()}"></label><label>Nama klien<input id="nn"></label><label>Tipe<select id="nt">${Object.keys(ST).map(t=>`<option>${t}</option>`).join("")}</select></label><label>Produk (sama persis dgn nama produk)<select id="np">${S.products.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select></label></div><p><button class="b" data-a="addord">Simpan pesanan</button></p></details></div>
 ${ORD.slice().reverse().map(o=>`<div class="ord" data-row="${o._row}"><header><b>${esc(o.Kode)} · ${esc(o.Nama||"-")}</b><span class="mut">${esc(o.Produk)} · ${esc(o.Tipe)} · ${esc(o.Update)}</span></header><div class="g2"><label>Tahap<select data-f="Tahap">${(ST[o.Tipe]||ST.fisik).map(s=>`<option ${s==o.Tahap?"selected":""}>${s}</option>`).join("")}</select></label><label>Catatan untuk klien<input data-f="Catatan" value="${esc(o.Catatan)}"></label><label>Kurir<input data-f="Kurir" value="${esc(o.Kurir)}" placeholder="JNE / J&T / ..."></label><label>Resi<input data-f="Resi" value="${esc(o.Resi)}"></label><label>Link<input data-f="Link" value="${esc(o.Link)}"></label></div><p><button class="b" data-a="saveord">Simpan</button></p></div>`).join("")||'<p class="mut">Belum ada pesanan.</p>'}`},
prod(){return`<p><button class="b g" data-a="newprod">+ Tambah produk</button></p><div class="card w"><table><tr><th></th><th>Produk</th><th>Harga</th><th></th></tr>${S.products.map((p,i)=>`<tr><td><img class="thumb" src="${esc(src(p.img))}" alt=""></td><td><b>${esc(p.name)}</b><br><span class="mut">${esc(p.cat)}${p.home?" · beranda":""}${p.tag?" · "+esc(p.tag):""}</span></td><td>${esc(p.price)}</td><td style="white-space:nowrap"><button class="b l" data-a="up" data-i="${i}">↑</button> <button class="b l" data-a="dn" data-i="${i}">↓</button> <button class="b" data-a="editprod" data-i="${i}">Edit</button> <button class="b r" data-a="delprod" data-i="${i}">Hapus</button></td></tr>`).join("")}</table></div>`},
gal(){return`<p><label class="b g" style="position:relative">+ Unggah foto<input type="file" accept="image/*" multiple data-a="upgal" style="display:none"></label></p><div class="gal">${S.gallery.map((g,i)=>`<div class="card"><img src="${esc(src(g.img))}" alt=""><input data-i="${i}" data-a="cap" value="${esc(g.cap)}" placeholder="Keterangan" style="margin-top:8px"><button class="b r" data-a="delgal" data-i="${i}" style="margin-top:8px">Hapus</button></div>`).join("")||'<p class="mut">Galeri kosong.</p>'}</div>`},
fin(){const[f,t]=rng(),l=inR(f,t),s=sum(l),by={},mo=(new Date(t>"9"?today():t)-new Date(f<"1"?l[0]?.tgl||today():f))/864e5>62;l.forEach(x=>{const k=mo?x.tgl.slice(0,7):x.tgl.slice(5),b=by[k]||(by[k]={m:0,k:0});b[x.tipe=="masuk"?"m":"k"]+=x.jml});const ks=Object.keys(by).sort(),mx=Math.max(1,...ks.map(k=>Math.max(by[k].m,by[k].k)));
 return`<div class="card noprint"><div class="row"><label style="width:200px">Rentang<select id="fr">${[["7","7 hari"],["15","15 hari"],["30","30 hari"],["180","6 bulan"],["365","1 tahun"],["bulan","Per bulan"],["tahun","Per tahun"],["semua","Semua"]].map(o=>`<option value="${o[0]}" ${o[0]==FR.t?"selected":""}>${o[1]}</option>`).join("")}</select></label>${FR.t=="bulan"?`<label>Bulan<input type="month" id="fm" value="${FR.m}"></label>`:""}${FR.t=="tahun"?`<label style="width:110px">Tahun<input type="number" id="fy" value="${FR.y}"></label>`:""}<button class="b l" data-a="csv">Unduh CSV (Excel)</button><button class="b l" onclick="print()">Cetak / PDF</button></div></div>
 <div class="kpi">${kpi("Pemasukan",rp(s.m))}${kpi("Modal bahan (HPP)",rp(s.h))}${kpi("Laba kotor",rp(s.gp))}${kpi("Biaya operasional",rp(s.o))}${kpi("Laba bersih",rp(s.np))}</div>
 <div class="card"><h3>Arus kas <small class="mut">emas = masuk · biru = keluar</small></h3><div class="chart">${ks.map(k=>`<div><span><i style="height:${by[k].m/mx*100}%"></i><i class="o" style="height:${by[k].k/mx*100}%"></i></span>${k}</div>`).join("")||'<span class="mut">Belum ada data.</span>'}</div></div>
 <div class="card noprint"><h3>Catat transaksi</h3><div class="row"><label>Tanggal<input type="date" id="xt" value="${today()}"></label><label>Jenis<select id="xj"><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select></label><label>Kategori<input id="xk" list="kat" value="Penjualan"></label><datalist id="kat"><option>Penjualan<option>Bahan (HPP)<option>Operasional<option>Iklan<option>Pengiriman<option>Lainnya</datalist><label>Jumlah (Rp)<input type="number" id="xm" min="1"></label><label>Keterangan<input id="xe"></label><button class="b" data-a="addfin">Tambah</button></div></div>
 <div class="card w"><table><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th>Jumlah</th><th class="noprint"></th></tr>${l.slice().reverse().map(x=>`<tr><td>${x.tgl}</td><td>${esc(x.kat)}</td><td>${esc(x.ket)}</td><td style="color:${x.tipe=="masuk"?"var(--ok)":"var(--bad)"}">${x.tipe=="masuk"?"+":"−"}${rp(x.jml)}</td><td class="noprint"><button class="b r" data-a="delfin" data-r="${x._row}">×</button></td></tr>`).join("")||'<tr><td colspan=5 class="mut">Tidak ada transaksi pada rentang ini.</td></tr>'}</table></div>`},
tamp(){const F=[["Nama brand","brand"],["Tagline","tagline"],["Nomor WhatsApp (62…)","wa"],["Label bar promo","promo.label"],["Teks promo (desktop, boleh <b>)","promo.long"],["Teks promo (HP)","promo.short"],["Teks tombol promo","promo.link"],["Tujuan tombol promo","promo.href"],["Telepon tampil","contact.phone"],["Jam buka","contact.hours"],["Lokasi","contact.loc"],["Email","contact.email"],["Facebook (URL)","contact.fb"],["Instagram (URL)","contact.igUrl"]];
 return`<div class="card"><div class="g2">${F.map(f=>`<label>${f[0]}<input data-p="${f[1]}" value="${esc(gp(f[1]))}"></label>`).join("")}</div><p class="mut">Kosongkan teks promo desktop untuk menyembunyikan bar promo.</p></div>
 <div class="card"><label>Foto hero<div class="row"><img class="thumb" id="hpv" src="${esc(src(S.heroImg))}" alt=""><input type="file" accept="image/*" data-a="uphero" style="width:auto"></div></label></div>
 <div class="card"><label>Tentang kami (satu paragraf per baris)<textarea data-p="about" data-t="lines" style="min-height:130px">${esc((S.about||[]).join("\n"))}</textarea></label></div>
 <div class="card"><label>FAQ (format: Pertanyaan :: Jawaban, satu per baris)<textarea data-p="faq" data-t="faq" style="min-height:170px">${esc((S.faq||[]).map(f=>f[0]+" :: "+f[1]).join("\n"))}</textarea></label></div>`},
set(){return`<div class="card"><h3>Koneksi</h3><div class="g2">${[["URL web utama","site"],["URL Apps Script (/exec)","api"],["Kunci admin (ADMIN_KEY)","key"],["Repo GitHub (pemilik/nama-repo)","repo"],["Branch","br"],["Token GitHub (fine-grained, hanya repo ini, izin Contents: write)","tok"]].map(f=>`<label>${f[0]}<input data-c="${f[1]}" value="${esc(C[f[1]])}" ${/key|tok/.test(f[1])?'type="password"':""}></label>`).join("")}</div><p><button class="b" data-a="saveset">Simpan &amp; muat ulang</button></p><p class="mut">Data ini hanya tersimpan di browser perangkat ini.</p></div>`}};
const gp=p=>p.split(".").reduce((o,k)=>o&&o[k],S)||"",sp=(p,v)=>{const a=p.split("."),l=a.pop();let o=S;a.forEach(k=>o=o[k]=o[k]||{});o[l]=v};
function render(){$("#nav").innerHTML=NAV.map(n=>`<button class="${n[0]==view?"on":""}" data-nav="${n[0]}">${n[1]}</button>`).join("");$("#ttl").textContent=NAV.find(n=>n[0]==view)[1].slice(2);bar();
 $("#v").innerHTML=!S&&view!="set"?`<div class="card"><h3>Data web utama belum termuat</h3><p class="mut">Periksa pengaturan koneksi.</p><button class="b" data-nav="set">Buka Pengaturan</button></div>`:V[view]()}
function prodForm(i){const p=i>=0?S.products[i]:{cat:S.cats[0].id,home:0};$("#dlg").innerHTML=`<form id="pf"><h3>${i>=0?"Edit":"Tambah"} produk</h3><div class="g2"><label>Kategori<select name="cat">${S.cats.map(c=>`<option value="${c.id}" ${c.id==p.cat?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label><label>Nama (kunci data, jangan diubah jika sudah ada ulasan)<input name="name" required value="${esc(p.name)}"></label><label>Judul tampil<input name="title" value="${esc(p.title)}"></label><label>Harga (teks)<input name="price" value="${esc(p.price)}"></label><label>Link demo (opsional)<input name="demo" value="${esc(p.demo)}"></label><label>Label (mis. Baru)<input name="tag" value="${esc(p.tag)}"></label></div><label style="margin-top:12px">Deskripsi<textarea name="desc">${esc(p.desc)}</textarea></label><label><input type="checkbox" name="home" style="width:auto" ${p.home?"checked":""}> Tampilkan di beranda</label>
 <div class="row" style="margin:10px 0"><img class="thumb" id="ppv" src="${esc(src(p.img))}" alt=""><input type="hidden" name="img" value="${esc(p.img)}"><input type="file" accept="image/*" data-a="upprod" style="width:auto"></div><div class="row"><button class="b g">Simpan</button><button type="button" class="b l" data-a="close">Batal</button></div></form>`;$("#dlg").showModal();
 $("#pf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),o={cat:f.get("cat"),name:f.get("name").trim(),title:f.get("title").trim()||f.get("name").trim(),price:f.get("price").trim(),desc:f.get("desc").trim(),tag:f.get("tag").trim(),img:f.get("img"),home:f.get("home")?1:0};if(f.get("demo").trim())o.demo=f.get("demo").trim();i>=0?S.products[i]=o:S.products.push(o);touch();$("#dlg").close();render()}}
document.addEventListener("click",async e=>{const n=e.target.closest("[data-nav]");if(n){view=n.dataset.nav;render();return}const b=e.target.closest("[data-a]");if(!b||b.tagName=="INPUT")return;const a=b.dataset.a,i=+b.dataset.i;
